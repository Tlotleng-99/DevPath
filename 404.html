<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | DevPath</title>
    <link rel="stylesheet" href="static/style.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .error-box {
        max-width: 640px;
        background: white;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 24px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        padding: 2.5rem;
        text-align: center;
      }
      h1 {
        font-size: clamp(2.8rem, 6vw, 5rem);
        margin: 0 0 1rem;
      }
    </style>
  </head>
  <body>
    <main class="error-box">
      <p class="eyebrow">404</p>
      <h1>Page not found</h1>
      <p>The page you were looking for does not exist or may have moved.</p>
      <a href="index.html" class="button primary">Back to home</a>
    </main>
  </body>
</html>
